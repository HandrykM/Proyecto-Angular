services:
  # Backend
  - type: web
    name: hydrosave-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        value: interchange.proxy.rlwy.net
      - key: DB_PORT
        value: 50866
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: railway
      - key: JWT_SECRET
        sync: false
      - key: EMAIL_USER
        value: hydrosave05@gmail.com
      - key: EMAIL_PASSWORD
        sync: false
      - key: CLIENT_URL
        value: https://hydrosave-frontend.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://hydrosave-frontend.onrender.com

  # Frontend
  - type: web
    name: hydrosave-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cp src/_redirects dist/frontend/
    staticPublishPath: frontend/dist/frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html